theme: jekyll-theme-minimal
url: https://thomas-serre.com
title: Thomas Serre
description: "Machine and Biological Vision • Computational Neuroscience • AI&nbsp;•&nbsp;NeuroAI&nbsp;•&nbsp;XAI"
defaults:
  - scope:
      path: "assets/img"
    values:
      logo: logo.gif

# Internal notes, agent files and tooling are not part of the published site.
exclude:
  - README.md
  - CLAUDE.md
  - AGENT_TASK.md
  - distilled_memory.md
  - memory/
  - ACCESSIBILITY.md
  - CUSTOM_DOMAIN_SETUP.md
  - GOOGLE_SEARCH_CONSOLE_REDIRECT_GUIDE.md
  - INDEXING_FIX.md
  - JEKYLL_SETUP_STATUS.md
  - REDIRECT_FIX.md
  - _posts/_site/
  - _posts/.jekyll-cache/
  - scripts/
  - update_cv.sh
  - cv_update_functions.sh
  - start_server.sh
  - Rakefile
  - Gemfile
  - Gemfile.lock
